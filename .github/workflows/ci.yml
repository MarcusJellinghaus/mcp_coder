name: Python CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-forbidden-folders:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Check for forbidden folders in PR
      run: |
        echo "Checking for forbidden folders in pull request..."
        
        # Function to check for folder existence case-insensitively
        check_forbidden_folder() {
          local pattern="$1"
          local description="$2"
          
          # Use find with case-insensitive matching
          if find . -type d -ipath "*${pattern}*" -print -quit | grep -q .; then
            echo "❌ ERROR: Found forbidden folder matching '${pattern}'"
            echo "Description: ${description}"
            find . -type d -ipath "*${pattern}*" | sed 's/^/ Found: /'
            return 1
          else
            echo "✅ No forbidden folder found for pattern: ${pattern}"
            return 0
          fi
        }
        
        # Function to check if folder is empty (or doesn't exist)
        check_empty_folder() {
          local pattern="$1"
          local description="$2"
          
          # Find matching folders
          local folders=$(find . -type d -path "*${pattern}*" 2>/dev/null)
          
          if [ -z "$folders" ]; then
            echo "✅ Folder not found (acceptable): ${pattern}"
            return 0
          fi
          
          # Check if any found folder is not empty
          local has_content=0
          while IFS= read -r folder; do
            if [ -n "$(find "$folder" -mindepth 1 -print -quit)" ]; then
              echo "❌ ERROR: Folder should be empty: ${folder}"
              echo "Description: ${description}"
              find "$folder" -mindepth 1 -maxdepth 1 | sed 's/^/ Contains: /'
              has_content=1
            fi
          done <<< "$folders"
          
          if [ $has_content -eq 1 ]; then
            return 1
          else
            echo "✅ Folder exists and is empty: ${pattern}"
            return 0
          fi
        }
        
        # Check for forbidden folders
        ERROR=0
        
        check_forbidden_folder "pr_info" "Temporary development folder (planning, tracking, review logs)" || ERROR=1
        check_forbidden_folder ".scratch" "Agent scratch probes (throwaway tests) - delete after the experiment" || ERROR=1
        check_empty_folder "docs/tests/performance_data/prof" "Profiler output folder should be empty in PRs" || ERROR=1
        
        if [ $ERROR -eq 1 ]; then
          echo ""
          echo "❌ PULL REQUEST BLOCKED: Forbidden folders detected!"
          echo "These folders should not be included in pull requests."
          echo "Please remove them and update your .gitignore if necessary."
          echo "Note: These folders are allowed in regular commits, just not in PRs."
          exit 1
        else
          echo ""
          echo "✅ All checks passed! No forbidden folders found."
        fi

  # Matrix approach: Each check runs as independent job with individual pass/fail status
  # fail-fast: false ensures all checks complete even if one fails
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - {name: "ruff-format", cmd: "ruff version && ruff format --check src tests tools"}
          - {name: "pylint", cmd: "pylint --version && pylint ./src ./tests"}  # configuration via pyproject.toml
          - {name: "ruff", cmd: "ruff version && ruff check src tests tools"}
          - {name: "mypy", install: ".[typecheck]", cmd: "mypy --version && mypy --strict src tests"}
          - {name: "file-size", cmd: "mcp-coder check file-size --max-lines 750 --allowlist-file .large-files-allowlist"}
          - {name: "no-url-deps", cmd: "python tools/check_no_url_deps.py"}
          - {name: "forbidden-calls", cmd: "python tools/check_forbidden_calls.py"}
    name: ${{ matrix.check.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.11
          
      - name: Install dependencies
        run: |
          mapfile -t SPECS < <(python tools/read_github_deps.py --specs)
          uv pip install --system "${SPECS[@]}" "${{ matrix.check.install || '.[dev,langchain]' }}"
      
      - name: Environment info
        run: |
          uname -a
          python --version
          uv --version
          git --version
          
      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.cmd }}

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          mapfile -t SPECS < <(python tools/read_github_deps.py --specs)
          uv pip install --system "${SPECS[@]}" ".[dev,langchain]"

      - name: Run unit-tests
        env:
          COVERAGE_FILE: .coverage.unit
        run: |
          pytest --version && pytest -m 'not git_integration and not claude_cli_integration and not claude_api_integration and not copilot_cli_integration and not formatter_integration and not github_integration and not install_integration and not langchain_integration and not llm_integration and not textual_integration' --cov=src/mcp_coder --cov-report= --junitxml=unit-tests.xml

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-unit
          path: .coverage.unit
          include-hidden-files: true
          retention-days: 1

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          mapfile -t SPECS < <(python tools/read_github_deps.py --specs)
          uv pip install --system "${SPECS[@]}" ".[dev,langchain]"

      - name: Run integration-tests
        env:
          COVERAGE_FILE: .coverage.integration
        run: |
          pytest --version && pytest -m 'git_integration or formatter_integration or github_integration or install_integration' --cov=src/mcp_coder --cov-report= --junitxml=integration-tests.xml

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-integration
          path: .coverage.integration
          include-hidden-files: true
          retention-days: 1

  langchain-integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MCP_CODER_LLM_LANGCHAIN_BACKEND: ${{ secrets.MCP_CODER_LLM_LANGCHAIN_BACKEND }}
      MCP_CODER_LLM_LANGCHAIN_MODEL: ${{ secrets.MCP_CODER_LLM_LANGCHAIN_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          mapfile -t SPECS < <(python tools/read_github_deps.py --specs)
          uv pip install --system "${SPECS[@]}" ".[dev,langchain]"

      - name: Run LangChain integration tests
        env:
          COVERAGE_FILE: .coverage.langchain
        run: |
          pytest tests/llm/providers/langchain/test_langchain_integration.py \
            tests/icoder/test_icoder_permission_wiring.py \
            -m langchain_integration \
            -v -s \
            --cov=src/mcp_coder --cov-report= \
            --junitxml=langchain-integration-tests.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: langchain-integration-results
          path: langchain-integration-tests.xml

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-langchain
          path: .coverage.langchain
          include-hidden-files: true
          retention-days: 1

  coverage:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, langchain-integration]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.11

      - name: Install coverage tools
        run: pip install coverage diff-cover

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true

      - name: Combine coverage data
        id: coverage_combine
        run: |
          coverage combine coverage-data
          coverage xml -o coverage.xml
          echo "total=$(coverage report --format=total)" >> "$GITHUB_OUTPUT"

      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.BADGE_GIST_TOKEN }}
          gistID: ${{ vars.BADGE_GIST_ID }}
          filename: mcp_coder-coverage.json
          label: coverage
          message: ${{ steps.coverage_combine.outputs.total }}%
          color: blue

      - name: Run diff-cover
        if: github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml \
            --compare-branch=origin/${{ github.event.pull_request.base.ref }} \
            --format markdown:diff-coverage.md || true

      - name: Write coverage step summary
        run: |
          if [ -f diff-coverage.md ]; then
            python tools/ci_coverage_summary.py --coverage-xml coverage.xml --diff-report diff-coverage.md --output "$GITHUB_STEP_SUMMARY"
          else
            python tools/ci_coverage_summary.py --coverage-xml coverage.xml --output "$GITHUB_STEP_SUMMARY"
          fi

  # Exercises the install sequence that vscodeclaude sessions run at launch.
  # The argv is built by
  # src/mcp_coder/workflows/vscodeclaude/session_setup.py:build_install_argv
  # (session_setup shells out to `mcp-coder install`; see #695). This job
  # mirrors that argv so a break in the installer contract surfaces here.
  # Independent of `test` because it uses an activated project venv (not
  # --system) and pulls siblings at HEAD via
  # [tool.mcp-coder.install-from-github] — see #969.
  vscodeclaude-template-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.11

      - name: Run vscodeclaude template install sequence
        env:
          # Full clone so setuptools_scm can read tags on sibling repos (#817)
          UV_GIT_SHALLOW: "0"
        run: |
          set -euo pipefail

          # Bootstrap mcp-coder into the SYSTEM Python, not ./.venv:
          # `mcp-coder install . --use-sync` runs `uv sync`, which rewrites
          # ./.venv mid-run and would wipe a bootstrap installed there.
          #
          # Siblings come from GitHub HEAD, exactly as every other job does: the
          # PyPI copies of mcp-workspace / mcp-coder-utils are too old for
          # mcp_coder's imports, so a bare `uv pip install --system .` bootstrap
          # could not even `import mcp_coder`, let alone run the subcommand.
          mapfile -t SPECS < <(python tools/read_github_deps.py --specs)
          uv pip install --system "${SPECS[@]}" .

          # Mirror the argv session_setup.build_install_argv produces:
          mcp-coder install . \
            --source local \
            --local-path . \
            --use-sync \
            --refresh

          # Activate the venv `mcp-coder install` created, smoke-check end-to-end.
          # shellcheck disable=SC1091
          source .venv/bin/activate
          mcp-coder --version
          mcp-tools-py --version
          mcp-workspace --version
          python -c "import mcp_coder; print('mcp_coder import OK from', mcp_coder.__file__)"

  # Architecture checks - only run on pull requests
  # These validate module boundaries and import structure
  architecture:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        check:
          - {name: "import-linter", cmd: "uv pip show import-linter | grep Version && ./tools/lint_imports.sh"}
          - {name: "tach", cmd: "tach --version && ./tools/tach_check.sh"}
          - {name: "pycycle", cmd: "pycycle --version && ./tools/pycycle_check.sh"}
          - {name: "vulture", cmd: "vulture --version && ./tools/vulture_check.sh"}
          - {name: "deptry", cmd: "deptry --version && ./tools/deptry_check.sh"}
    name: ${{ matrix.check.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.11
          
      - name: Install dependencies
        run: |
          mapfile -t SPECS < <(python tools/read_github_deps.py --specs)
          uv pip install --system "${SPECS[@]}" ".[dev,langchain]"
      
      - name: Environment info
        run: |
          uname -a
          python --version
          uv --version
          git --version
          
      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.cmd }}
